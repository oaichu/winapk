[workspace]
resolver = "2"
members = [
    "crates/winapk-core",
    "crates/winapk-engine",
    "crates/winapk-install",
    "crates/winapk-display",
    "crates/winapk-share",
    "crates/winapk-agent",
    "crates/winapk",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/RoutineMiku/apkstart" # fork lineage, see NOTICE

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
